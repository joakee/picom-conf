  # default_anim.glsl (set by the window_type = 'normal' rule) has an
  # anim() that just returns the texel unchanged, so it was functionally
  # the same as the default.glsl it was being swapped for.
  #
  # The remaining keys below are cosmetic only and have no bearing on the
  # black-window bug -- delete them if you would rather Wine windows look
  # like everything else. Note opacity = 1 overrides
  # _NET_WM_WINDOW_OPACITY, so picom-trans will not work on Wine windows.
  #
  # Wine sets WM_CLASS res_class to the executable name, hence '.exe'
  # (verified: `wine notepad` gives WM_CLASS = "notepad.exe",
  # "notepad.exe"). Check a stray window with `xprop WM_CLASS`.
  # ============================================================
  match = "class_g *?= '.exe'";
  unredir = "passive";
  shadow = false;
  blur-background = false;
  corner-radius = 0;
  opacity = 1;
  dim = 0;
  invert-color = false;
  transparent-clipping = false;
  clip-shadow-above = false;
})

animations = ({
  # Pop in
  # Options
  duration = 0.2;
  opacity-duration = 0.2;
  initial-scale = 0.8;
  
  triggers = ["open", "show"];
  anim-curve = {
        curve = "cubic-bezier(0, 1.5, 1, 1)";
        start = 0;
        end = 1;
        duration = "duration";
        }
  opacity-curve = {
        curve = "cubic-bezier(0.5, 0.5, 0.5, 0.5)";
        start = 0;
        end = 1;
        duration = "opacity-duration";
        }
  scale-x = "anim-curve * (1 - initial-scale) + initial-scale";
  scale-y = "anim-curve * (1 - initial-scale) + initial-scale";
  offset-x = "(1 - scale-x) / 2 * window-width" 
  offset-y = "(1 - scale-y) / 2 * window-height" 

  opacity = "opacity-curve";
  shadow-offset-x = "offset-x";
  shadow-offset-y = "offset-y";
  shadow-scale-x = "scale-x";
  shadow-scale-y = "scale-y";
}, {
  # Pop-out
  # Options
  duration = 0.1;
  opacity-duration = 0.1;
  initial-scale = 0.8;

  triggers = ["hide"];
  anim-curve = {
        curve = "cubic-bezier(0, 0, 1, -0.5)";
        start = 1;
        end = 0;
        duration = "duration";
        }
  opacity-curve = {
        curve = "cubic-bezier(0.5, 0.5, 0.5, 0.5)";
        start = 1;
        end = 0;
        duration = "opacity-duration";
        }
  scale-x = "anim-curve * (1 - initial-scale) + initial-scale";
  scale-y = "anim-curve * (1 - initial-scale) + initial-scale";
  offset-x = "(1-scale-x) / 2 * window-width" 
  offset-y = "(1-scale-y) / 2 * window-height" 

  opacity = "opacity-curve";
  shadow-offset-x = "offset-x";
  shadow-offset-y = "offset-y";
  shadow-scale-x = "scale-x";
  shadow-scale-y = "scale-y";
}, {
  triggers = ["close"];
  preset = "disappear";
  scale = 1.4;
  duration = 0.2;
}, {
  triggers = ["geometry"];
  duration = 0.2;
      scale-x = {
        curve = "cubic-bezier(0, 1, 1, 1)";
        duration = "duration";
        start = "window-width-before / window-width";
        end = 1;
    };
    scale-y = {
        curve = "cubic-bezier(0, 1, 1, 1)";
        duration = "duration";
        start = "window-height-before / window-height";
        end = 1;
    };
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    offset-x = {
        curve = "cubic-bezier(0, 1, 1, 1)";
        duration = "duration";
        start = "window-x-before - window-x";
        end = 0;
    };
    offset-y = {
        curve = "cubic-bezier(0, 1, 1, 1)";
        duration = "duration";
        start = "window-y-before - window-y";
        end = 0;
    };
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
})

blur:
{
  method = "dual_kawase";
  size = 12;
  strength = 8;
  blur-background = true;
  blur-background-frame = true;
  #deviation = 10.0;
};

# NOTE: wintypes used to be configured here (see note above shadow-exclude)
# - migrated into "rules:" above. normal/desktop/dock/splash/utility had no
# overrides set ({}), so nothing to migrate for those. The "focus" wintype
# key (force always-focused) has no equivalent rule key - rules dropped the
# "active window" concept entirely (see man page's "Migrating old rules"
# section) - but this config doesn't set inactive-opacity/inactive-dim
# anywhere, so it has no visible effect either way.


